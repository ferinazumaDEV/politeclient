name: tests

# The 92 tests are offline: politeclient's suite spins up local HTTP servers and
# never reaches the network, so CI runs exactly what the author runs.
#
# The matrix is 3.9-3.12, copied from the classifiers in pyproject.toml rather
# than chosen, so the support the package advertises is the support that gets
# tested. Note that Python 3.9 reached end of life on 2025-10-31; it is kept
# here because the published package still claims it. If that claim is dropped,
# drop the row here in the same commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

  build:
    # A package that cannot be built cannot be released. Cheap to check here,
    # expensive to discover at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the metadata renders on PyPI
        run: python -m twine check dist/*
